function melee(){P.mel=.45;P.melA=.22;sfx('melee');
 for(let i=E.length-1;i>=0;i--){const e=E[i],dx=e.x-P.x,dy=e.y-P.y;if(dx>-25&&dx<140&&abs(dy)<85)killE(e,i)}
 for(let i=S.length-1;i>=0;i--){const s=S[i],dx=s.x-P.x,dy=s.y-P.y;if(dx>-25&&dx<140&&abs(dy)<85){part(s.x,s.y,12,'#ffe08a',200,.5,3);S.splice(i,1)}}
 part(P.x+70,P.y,10,'#fff',260,.3,2)}
function movP(dt){const k=1-Math.exp(-13*dt),ox=P.x,oy=P.y;P.x+=(cl(mx,40,W-80)-P.x)*k;P.y+=(cl(my,70,H-50)-P.y)*k;P.vx=(P.x-ox)/dt;P.vy=(P.y-oy)/dt;P.ph+=dt*(9+min(abs(P.vy)*.012,8))}
function bossDown(){const b=boss;for(let i=0;i<6;i++)part(b.x+rnd(-50,50),b.y+rnd(-40,40),30,['#ffb347','#ff5533','#fff'][i%3],380,1.1,4,120);part(b.x,b.y,40,'#444',260,1.5,5,200,1);part(b.x,b.y,30,'#fff',240,2,3,120,1);
 shake=.7;sfx('boom');sc+=500;boss=null;E.forEach(e=>part(e.x,e.y,10,'#ffb347',200,.5,3));E=[];S=[];st='clear';ct=2.8;banner={t:2.6,s:'¡Jefe derrotado!'}}
function bossAI(dt){const b=boss;b.t+=dt;b.hit-=dt;
 if(b.ent){b.x-=260*dt;if(b.x<=W-140){b.x=W-140;b.ent=0}}
 b.y=H/2+sin(b.t*(.8+b.k*.1))*(H/2-135);if(b.ent)return;
 if((b.sh-=dt)<=0){b.sh=max(.7,1.4-b.k*.1);const a0=Math.atan2(P.y-b.y,P.x-b.x),v=340+b.k*20,n=b.k>=2?5:3;for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.22;S.push({x:b.x+b.mx,y:b.y,vx:cos(a)*v,vy:sin(a)*v,r:16,rot:0})}sfx('hit');part(b.x+b.mx,b.y,8,'#ffe08a',160,.3,2)}
 if((b.fs-=dt)<=0){b.fs=max(.45,1-b.k*.08);S.push({x:rnd(60,W-260),y:-20,vx:rnd(-30,10),vy:rnd(200,260),r:15,rot:0})}
 if((b.sp-=dt)<=0){b.sp=max(3,6-b.k*.5);spawnE(b.x-60,b.y-30);spawnE(b.x-60,b.y+30)}}
function houseStart(){st='house';house={t:0,x:W+200,said:0};E=[];S=[];O=[];B=[];sc+=200}
function upHouse(dt){const h=house;h.t+=dt;h.x+=(W*.7-h.x)*min(1,dt*3);
 if(h.t>.4){const k=min(1,dt*3.2);P.x+=(h.x-6-P.x)*k;P.y+=(251-P.y)*k}else movP(dt);
 if(h.t>2&&!h.said){h.said=1;sfx('win');part(h.x,220,45,'#ffd24a',280,1.3,3,120,2)}
 if(h.t>4.2)next()}
function upPlay(dt){
 time+=dt;movP(dt);const M=MS[m];
 P.cd-=dt;P.mel-=dt;P.melA-=dt;P.inv-=dt;mBuf-=dt;
 if(down&&P.cd<=0)shoot();
 if(mBuf>0&&P.mel<=0){mBuf=0;melee()}
 if(!M.t){sp-=dt;if(sp<=0){spawnE();sp=max(.9,rnd(1.6,2.8)-m*.045)}sp2-=dt;if(sp2<=0){spawnO(M);sp2=rnd(1.3,1.9)}}else{bossAI(dt);if(boss&&!boss.ent){sp-=dt;if(sp<=0){spawnE();sp=max(1.1,rnd(2.2,3.4)-boss.k*.2)}}}
 for(let i=B.length-1;i>=0;i--){const b=B[i];b.x+=b.vx*dt;let dead=b.x>W+30;
  for(let j=E.length-1;j>=0&&!dead;j--){const e=E[j];if((e.x-b.x)**2+(e.y-b.y)**2<650){dead=true;if(--e.hp<=0)killE(e,j);else{part(b.x,b.y,6,'#ffd26a',180,.3,2);sfx('hit')}}}
  for(let j=O.length-1;j>=0&&!dead;j--){const o=O[j];if(!o.ok&&abs(o.x-b.x)<o.bw/2&&abs(o.yy-b.y)<18){dead=true;part(o.x,o.yy,14,'#ff7a4a',200,.5,3);O.splice(j,1);sfx('hit')}}
  if(boss&&!dead&&!boss.ent&&(boss.x-b.x)**2+(boss.y-b.y)**2<boss.r*boss.r){dead=true;boss.hp--;boss.hit=.08;part(b.x,b.y,8,'#ffd26a',240,.4,3);sfx('hit');sc+=2;if(boss.hp<=0)bossDown()}
  if(dead){B[i]=B[B.length-1];B.pop()}}
 for(let i=E.length-1;i>=0;i--){const e=E[i];e.t+=dt;e.x+=e.vx*dt;if(e.hm)e.y0=cl(e.y0+(P.y-e.y0)*dt*1.1,60,H-60);e.y=e.y0+sin(e.t*3+e.ph)*e.a;
  if(e.x<W-30&&e.x>P.x+90&&S.length<34){e.sh-=dt;if(e.sh<=0){eagleShoot(e);e.sh=max(.4,(rnd(1.2,2)-m*.02)/(1.4*(1+m*.03)))}}
  if(e.x<-80){E[i]=E[E.length-1];E.pop();continue}
  if((e.x-P.x)**2+(e.y-P.y)**2<1100){hurt(12);killE(e,i)}}
 for(let i=O.length-1;i>=0;i--){const o=O[i];o.x+=o.vx*dt;o.ph+=dt*2;o.yy=o.y+sin(o.ph)*10;
  if(o.x<-120){O.splice(i,1);continue}
  if(abs(o.x-P.x)<o.bw/2+16&&abs(o.yy-P.y)<30){O.splice(i,1);
   if(o.ok){if(!got.includes(o.w)){got.push(o.w);sc+=50;sfx('word');part(P.x+20,P.y,18,'#7dff9b',220,.7,3);if(got.length>=5){houseStart();return}}}
   else{hurt(7);sfx('bad');part(o.x,o.yy,10,'#ff5040',180,.5,3)}}}
 for(let i=S.length-1;i>=0;i--){const s=S[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=dt*5;
  if(s.y>H+30||s.x<-40||s.x>W+40){S.splice(i,1);continue}
  if((s.x-P.x)**2+(s.y-P.y)**2<(s.r+16)**2){S.splice(i,1);part(s.x,s.y,14,s.k?'#ff8a3a':'#9b9186',220,.6,3,200,1);hurt(s.k?20:28)}}
 for(let i=Hs.length-1;i>=0;i--){const h=Hs[i];h.ph+=dt*6;const dx=P.x-h.x,dy=P.y-h.y,d=Math.hypot(dx,dy)||1;
  if(d<170){h.x+=dx/d*340*dt;h.y+=dy/d*340*dt}else{h.x-=60*dt;h.y+=sin(h.ph)*20*dt}
  if(d<26){P.hp=min(100,P.hp+8);sfx('heart');part(h.x,h.y,10,'#ff7aa8',160,.6,3);Hs.splice(i,1)}else if(h.x<-20)Hs.splice(i,1)}}
function update(dt){
 t+=dt;updPt(dt);if(shake>0)shake-=dt;if(flash>0)flash-=dt;if(banner)banner.t-=dt;
 if(st==='play')upPlay(dt);
 else if(st==='house')upHouse(dt);
 else if(st==='clear'){movP(dt);ct-=dt;if(ct<=0)next()}
 else if(st==='win'){wt+=dt;if(R()<.7)part(rnd(0,W),-10,2,['#ffd24a','#ff5a5a','#5ad1ff','#7dff9b','#fff'][(R()*5)|0],70,3.2,5,110,2);if(wt>4.5&&!applauded){applauded=1;applause()}}}

/* ================= HUD ================= */
const fmt=s=>String((s/60)|0).padStart(2,'0')+':'+String((s%60)|0).padStart(2,'0');
function radar(){const x=W-176,y=12,w=164,h=98,sx=w/W,sy=h/H;
 ctx.fillStyle='rgba(6,26,20,.7)';rr(x,y,w,h,8);ctx.fill();ctx.strokeStyle='rgba(90,255,170,.6)';ctx.lineWidth=1.5;ctx.stroke();
 ctx.strokeStyle='rgba(90,255,170,.15)';ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.moveTo(x,y+h/2);ctx.lineTo(x+w,y+h/2);ctx.stroke();
 ctx.fillStyle='rgba(90,255,170,.25)';ctx.fillRect(x+(t*70)%w,y,2,h);
 const dot=(a,b,c,r)=>{ctx.fillStyle=c;ctx.fillRect(x+cl(a,0,W)*sx-r,y+cl(b,0,H)*sy-r,r*2,r*2)};
 E.forEach(e=>dot(e.x,e.y,'#ff4d4d',2));O.forEach(o=>o.ok&&dot(o.x,o.yy,'#7dff9b',2.5));Hs.forEach(q=>dot(q.x,q.y,'#ff8ab5',2));S.forEach(s=>dot(s.x,s.y,s.k?'#ffa23a':'#bbb',s.k?2:1.5));
 if(boss)dot(boss.x,boss.y,'#ff2a2a',5);dot(P.x,P.y,'#4de1ff',3)}
function hud(){const M=MS[m];
 rr(14,12,236,24,12);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fill();
 const f=P.hp/100;if(f>0){rr(17,15,230*f,18,9);ctx.fillStyle='hsl('+(f*115)+',80%,48%)';ctx.fill()}
 heart(31,24,8,'#fff');txt(Math.ceil(P.hp)+'',140,25,14,'#fff','center',0);
 ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(17,42,110,6);ctx.fillStyle='#ffd24a';ctx.fillRect(17,42,110*(1-cl(P.mel/.45,0,1)),6);txt('Llave [ESPACIO]',134,45,11,'#fff','left',0);
 txt('Misión '+(m+1)+'/'+MS.length,16,66,15,'#fff','left');txt('Puntos '+sc,16,86,13,'#ffe9a8','left');
 if(!M.t){const x0=W/2-215;for(let i=0;i<5;i++){ctx.fillStyle=got[i]?'rgba(40,140,70,.92)':'rgba(0,0,0,.5)';rr(x0+i*86,10,82,28,8);ctx.fill();txt(got[i]||'· · ·',x0+i*86+41,24,13,'#fff','center',0)}txt(M.l,W/2,66,34,'#ffd24a')}
 else if(boss){ctx.fillStyle='rgba(0,0,0,.6)';rr(W/2-205,12,410,20,10);ctx.fill();if(boss.hp>0){ctx.fillStyle='#e23b3b';rr(W/2-202,15,404*boss.hp/boss.mhp,14,7);ctx.fill()}txt(M.n,W/2,52,16,'#fff')}
 radar();txt(fmt(time),W-94,126,16,'#fff')}

/* ================= DIBUJO PRINCIPAL ================= */
function world(){
 if(house)drawTree(house.x);
 Hs.forEach(h=>heart(h.x,h.y,11+sin(h.ph)*2,'#ff4f86'));
 O.forEach(o=>{ctx.font='bold 17px "Trebuchet MS",Verdana,sans-serif';ctx.fillStyle='rgba(255,252,235,.95)';rr(o.x-o.bw/2,o.yy-16,o.bw,32,16);ctx.fill();ctx.strokeStyle=o.ok?'#e0a82e':'#c9c2a8';ctx.lineWidth=2;ctx.stroke();txt(o.w,o.x,o.yy+1,17,'#4a3220','center',0)});
 E.forEach(e=>{drawBird(e.x,e.y,.85,-1,e.t*10+e.ph,e.hp>1?EAG2:EAG);if(e.sh<.3&&e.x<W-30&&e.x>P.x+90){ctx.save();ctx.globalCompositeOperation='lighter';const k=1-e.sh/.3;ctx.fillStyle='rgba(255,120,40,'+(.3+.5*k)+')';circ(e.x-38,e.y-3,4+8*k);ctx.fillStyle='rgba(255,240,180,'+k+')';circ(e.x-38,e.y-3,2+3*k);ctx.restore()}});
 if(boss)drawBoss(boss);
 S.forEach(s=>{if(s.k){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(255,120,40,.5)';ctx.lineWidth=s.r;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*.06,s.y-s.vy*.06);ctx.stroke();ctx.fillStyle='rgba(255,90,30,.35)';circ(s.x,s.y,s.r*2);ctx.fillStyle='rgba(255,170,60,.95)';circ(s.x,s.y,s.r);ctx.fillStyle='#fff3c0';circ(s.x,s.y,s.r*.45);ctx.restore();return}ctx.fillStyle='#6f685f';circ(s.x,s.y,s.r);ctx.fillStyle='#a89f93';circ(s.x-s.r*.3*cos(s.rot),s.y-s.r*.3*sin(s.rot),s.r*.4)});
 ctx.globalCompositeOperation='lighter';B.forEach(b=>{ctx.fillStyle='rgba(255,170,60,.9)';circ(b.x,b.y,6);ctx.fillStyle='rgba(255,230,160,.6)';ctx.fillRect(b.x-26,b.y-2,26,4)});ctx.globalCompositeOperation='source-over';
 if(st!=='dead'&&!(P.inv>0&&((P.inv*18)|0)%2)){const perch=st==='house'&&house.t>1.8;
  drawCondor(P.x,P.y,140,P.ph,perch?0:cl(P.vy*.0011,-.35,.35),perch?6:null);
  if(st==='play'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(P.x-28,P.y-66,56,6);ctx.fillStyle='hsl('+(P.hp*1.15)+',80%,48%)';ctx.fillRect(P.x-27,P.y-65,54*P.hp/100,4)}}
 if(P.melA>0){const k=P.melA/.22;ctx.strokeStyle='rgba(255,255,255,'+k+')';ctx.lineWidth=4+10*k;ctx.beginPath();ctx.arc(P.x+20,P.y,70+(1-k)*60,-1.1,1.1);ctx.stroke();ctx.strokeStyle='rgba(255,210,70,'+k+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(P.x+20,P.y,58+(1-k)*60,-1,1);ctx.stroke()}
 if(house&&house.t>2)bubble(P.x-10,P.y-70,'¡Lo lograste!');
 drawPt()}
function menuDraw(){
 drawCondor(W/2+sin(t*.8)*70,262+sin(t*1.6)*12,250,t*7,sin(t*.8)*.06);
 txt('CÓNDOR ANDINO',W/2,92,64,'#ffd24a');txt('Leyenda de los Cielos',W/2,150,28,'#fff');
 btns().forEach(b=>{const o=mx>b.x&&mx<b.x+b.w&&my>b.y&&my<b.y+b.h;ctx.fillStyle=o?'rgba(255,210,70,.95)':'rgba(20,30,60,.78)';rr(b.x,b.y,b.w,b.h,14);ctx.fill();ctx.strokeStyle='#ffd24a';ctx.lineWidth=2;ctx.stroke();txt(b.s,W/2,b.y+26,21,o?'#2b1d12':'#fff',  'center',o?0:1)});
 txt('Mouse: mover · Clic: disparar · Espacio: llave de pelea · P: pausa · M: sonido',W/2,H-24,15,'#fff')}
function btns(){const a=[];if(saved)a.push({s:'Continuar · misión '+(saved.m+1)+'/'+MS.length,f:()=>{m=saved.m;time=saved.time||0;sc=0;P.hp=100;start()}});a.push({s:'Nueva partida',f:()=>{m=0;time=0;sc=0;P.hp=100;start()}});return a.map((b,i)=>(b.x=W/2-160,b.y=330+i*62,b.w=320,b.h=50,b))}
function draw(){
 ctx.setTransform(K,0,0,K,0,0);ctx.save();
 if(shake>0)ctx.translate(rnd(-1,1)*shake*18,rnd(-1,1)*shake*18);
 bg();
 if(st==='menu')menuDraw();else{world();hud();
  if(banner&&banner.t>0){ctx.globalAlpha=min(1,banner.t*3);ctx.font='bold 24px "Trebuchet MS",Verdana,sans-serif';const w=ctx.measureText(banner.s).width+60;ctx.fillStyle='rgba(10,16,40,.7)';rr(W/2-w/2,150,w,50,14);ctx.fill();txt(banner.s,W/2,175,24,'#ffd24a');ctx.globalAlpha=1}}
 ctx.restore();
 if(flash>0){ctx.fillStyle='rgba(255,40,30,'+flash*.8+')';ctx.fillRect(0,0,W,H)}
 if(st==='dead'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);txt('El cóndor cayó…',W/2,230,48,'#ff8a7a');txt('Clic para reintentar la misión',W/2,290,22,'#fff')}
 if(st==='win'){ctx.fillStyle='rgba(8,12,34,.6)';ctx.fillRect(0,0,W,H);drawPt();txt('¡LEYENDA DE LOS CIELOS!',W/2,150,50,'#ffd24a');txt('Completaste las '+MS.length+' misiones',W/2,215,26,'#fff');txt('Tiempo: '+fmt(fin),W/2,275,40,'#7dff9b');txt('Puntos: '+sc,W/2,325,24,'#ffe9a8');txt('👏 👏 👏',W/2,385,40,'#fff');if(wt>1.5)txt('Clic para volver al menú',W/2,450,20,'#fff')}
 if(paused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);txt('PAUSA',W/2,250,56,'#fff');txt('Pulsa P para continuar',W/2,305,20,'#fff')}}

/* ================= ENTRADA ================= */
function pm(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height}
cv.addEventListener('pointermove',pm);
cv.addEventListener('pointerdown',e=>{if(e.button!==0)return;pm(e);ainit();down=true;
 if(st==='menu')btns().forEach(b=>{if(mx>b.x&&mx<b.x+b.w&&my>b.y&&my<b.y+b.h)b.f()});
 else if(st==='dead'){P.hp=100;start()}
 else if(st==='win'){if(wt>1.5){st='menu';banner=null;skyG=mkSky(0);fN=0}}
 else if(st==='play'&&!paused&&P.cd<=0)shoot()});
addEventListener('pointerup',()=>down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{ainit();
 if(e.code==='Space'){e.preventDefault();if(!e.repeat)mBuf=.15}
 else if(e.code==='KeyM'){muted=!muted;if(mg)mg.gain.value=muted?0:.5}
 else if(e.code==='KeyP'&&(st==='play'||st==='house'||st==='clear'))paused=!paused});
addEventListener('blur',()=>{down=false;if(st==='play')paused=true});

/* ================= BUCLE ================= */
function frame(ts){requestAnimationFrame(frame);let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=.016;dt=min(dt,.05);if(!paused)update(dt);draw()}
skyG=mkSky(0);requestAnimationFrame(frame);
})();
</script>
