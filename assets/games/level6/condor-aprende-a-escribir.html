<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aventura del Abecedario</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#5ec8f2;--sun:#ffd23f;--grass:#3bb273;--coral:#ff6b6b;--ink:#2b2d6e;--cream:#fffdf5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Fredoka','Comic Neue','Comic Sans MS',sans-serif;color:var(--ink);background:linear-gradient(#8fdcff,#d9f4ff 60%,#b9ec9a 60%,#3bb273);background-attachment:fixed;display:flex;justify-content:center;padding:12px}
#app{width:100%;max-width:860px}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:18px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:clamp(1.1rem,3.5vw,1.7rem);margin:0;flex:1}
.ib{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font-size:1.4rem;cursor:pointer}
.ib.off{background:#ddd;opacity:.6}
.bar{height:22px;background:#e6e6f5;border:3px solid var(--ink);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--coral),var(--coral) 12px,#ff8e8e 12px,#ff8e8e 24px);transition:width .5s}
.bt{font-size:.9rem;margin:4px 2px 10px;font-weight:600}
#map{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
#map b{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:.85rem;background:#fff;opacity:.55}
#map b.done{background:var(--grass);color:#fff;opacity:1}
#map b.cur{background:var(--sun);opacity:1;transform:scale(1.25);animation:pulse 1s infinite alternate}
#map b.star::after{content:"🎯";position:absolute;font-size:.6rem;margin:-26px 0 0 22px}
#map b{position:relative}
@keyframes pulse{to{transform:scale(1.4)}}
.stage{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
#let{font-size:clamp(5rem,20vw,9rem);font-weight:700;line-height:1;color:var(--coral);text-shadow:4px 4px 0 var(--ink)}
#emo{font-size:clamp(5rem,20vw,8rem);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15));animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
#sub{text-align:center;font-weight:600;margin:6px 0}
#pat{text-align:center;font-size:clamp(1.6rem,7vw,2.6rem);letter-spacing:.35em;font-weight:700;min-height:1.4em}
#inp{display:block;margin:8px auto;width:min(100%,420px);font:700 2rem 'Fredoka',sans-serif;text-align:center;padding:10px;border:4px solid var(--ink);border-radius:20px;color:var(--ink);background:#fff;outline:none}
#inp:focus{border-color:var(--coral)}
#inp.bad{animation:shake .4s;border-color:#d33}
#inp.good{border-color:var(--grass);background:#e8ffe8}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#fb{text-align:center;min-height:1.6em;font-size:1.2rem;font-weight:600}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{font:700 1.25rem 'Fredoka',sans-serif;color:var(--ink);background:var(--sun);border:4px solid var(--ink);border-radius:22px;padding:12px 22px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--grass);color:#fff}
.btn.sec{background:#fff}
.btn:focus-visible,.ib:focus-visible,#inp:focus-visible{outline:4px solid var(--coral);outline-offset:2px}
.hide{display:none!important}
#start{text-align:center}
#start h2{font-size:clamp(2rem,8vw,3.4rem);margin:8px 0}
#start .big{font-size:5rem}
#cv{width:100%;border:4px solid var(--ink);border-radius:20px;touch-action:none;cursor:crosshair;display:block;background:#8fdcff}
#ov{position:fixed;inset:0;background:rgba(43,45,110,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#ov .card{text-align:center;max-width:460px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#ov h2{font-size:clamp(1.5rem,6vw,2.2rem);margin:6px 0}
#ov .em{font-size:4.5rem}
#conf{position:fixed;inset:0;pointer-events:none;z-index:30}
@keyframes wob{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.12)}}
.loser{font-size:clamp(2.4rem,13vw,4rem)!important;color:var(--coral);text-shadow:3px 3px 0 var(--ink);animation:wob .35s infinite alternate}
.lose{animation:wob .25s infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
 <div class="card">
  <header>
   <h1>🔤 Aventura del Abecedario</h1>
   <button class="ib" id="bMus" title="Música" aria-label="Música">🎵</button>
   <button class="ib" id="bSfx" title="Sonidos y voz" aria-label="Sonidos y voz">🔊</button>
  </header>

  <section id="start">
   <div class="big">🐤✏️</div>
   <h2>¡Aprende a escribir!</h2>
   <p style="font-size:1.2rem">Escribe 3 palabras por cada letra del abecedario.<br>Después de algunas letras, ¡a detener a las gallinas que escapan de la granja! 🐔</p>
   <button class="btn go" id="bPlay" style="font-size:1.8rem">▶ ¡Jugar!</button>
   <div id="bReset" style="margin-top:14px"><button class="btn sec hide" id="bNew" style="font-size:1rem;padding:8px 16px">Empezar de nuevo</button></div>
  </section>

  <section id="game" class="hide">
   <div class="bar"><i id="pb"></i></div>
   <div class="bt" id="pt"></div>
   <div id="map"></div>
   <div class="stage"><div id="let">A</div><div id="emo">✈️</div></div>
   <div id="sub"></div>
   <div id="pat"></div>
   <input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Escribe la palabra">
   <div id="fb" aria-live="polite"></div>
   <div class="row">
    <button class="btn sec" id="bSay">🔊 Escuchar</button>
    <button class="btn sec" id="bHint">💡 Pista</button>
    <button class="btn go" id="bChk">✔ Comprobar</button>
   </div>
  </section>

  <section id="mg" class="hide">
   <canvas id="cv" width="800" height="450"></canvas>
  </section>
 </div>
</div>
<div id="ov" class="hide"><div class="card" id="ovc"></div></div>
<canvas id="conf"></canvas>

const D=RAW.split('\n').map(l=>{const t=l.split(' ');return{l:t[0],w:t.slice(1).map(x=>{const w=x.replace(/^[^A-Za-zÀ-ÿ]+/,'');return{e:x.slice(0,x.length-w.length),w}})}});
const MGSET=new Set(['C','F','I','L','Ñ','R','U','X','Z']);
const norm=s=>s.toLowerCase().replace(/\s+/g,'').replace(/ñ/g,'\u0001').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u0001/g,'ñ');

/* ---------- AUDIO (Web Audio, sin archivos) ---------- */
let AC,sfxG,musG,musOn=true,sfxOn=true,mTimer=null,mStep=0,mNext=0,mMode='main';
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}
 AC=new(window.AudioContext||window.webkitAudioContext)();
 sfxG=AC.createGain();sfxG.gain.value=.5;sfxG.connect(AC.destination);
 musG=AC.createGain();musG.gain.value=musOn?.13:0;musG.connect(AC.destination);loadAud()}
const BUF={};
function loadAud(){for(const k in AUD){const s=atob(AUD[k].split(',')[1]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);AC.decodeAudioData(u.buffer).then(b=>BUF[k]=b).catch(()=>{})}}
function playBuf(n,end){if(!AC||!sfxOn||!BUF[n])return false;const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=1.6;s.buffer=BUF[n];s.connect(g);g.connect(sfxG);if(end)s.onended=end;s.start();return true}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,d,type='sine',v=.25,t=0,dest){if(!AC)return;dest=dest||sfxG;
 const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;
 o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(0,s);
 g.gain.linearRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);
 o.connect(g);g.connect(dest);o.start(s);o.stop(s+d+.05)}
function noise(d,v){if(!AC||!sfxOn)return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(sfxG);s.start()}
const SFX={
 key(){tone(520+Math.random()*300,.06,'square',.08)},
 ok(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.25,i*.09))},
 bad(){tone(220,.2,'sawtooth',.15);tone(165,.25,'sawtooth',.15,.12)},
 win(){[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'square',.15,i*.12))},
 shot(){noise(.12,.5);tone(140,.12,'sawtooth',.2)},
 hit(){tone(900,.08,'square',.2);tone(1350,.14,'square',.2,.07);tone(1800,.2,'triangle',.15,.14)},
 tick(){tone(1100,.05,'square',.15)},
 lose(){[392,349,330,262].forEach((f,i)=>tone(f,.25,'triangle',.25,i*.18))}};
const sfx=n=>{if(sfxOn&&AC)SFX[n]()};
/* Música: melodía + bajo programados con adelanto */
const MEL=[72,0,76,0,79,76,72,0,74,0,77,0,81,77,74,0,76,0,79,0,84,79,76,0,79,77,76,74,72,0,67,0];
const BAS=[48,55,53,55,52,55,50,55];
function musicPlay(){if(!AC||mTimer)return;mNext=AC.currentTime+.1;
 mTimer=setInterval(()=>{const q=mMode==='mg'?.15:.24;
  while(mNext<AC.currentTime+.35){const t=mNext-AC.currentTime,m=MEL[mStep%32];
   if(m)tone(mtof(m),q*1.6,mMode==='mg'?'square':'triangle',.5,t,musG);
   if(mStep%4===0)tone(mtof(BAS[(mStep>>2)%8]),q*3,'sine',.9,t,musG);
   if(mStep%2===1)tone(mtof(96),.03,'square',.12,t,musG);
   mNext+=q;mStep++}},100)}
function setMusic(){if(musG)musG.gain.value=musOn?.13:0;$('bMus').classList.toggle('off',!musOn)}
$('bMus').onclick=()=>{initAudio();musOn=!musOn;setMusic();musicPlay()};
$('bSfx').onclick=()=>{sfxOn=!sfxOn;$('bSfx').classList.toggle('off',!sfxOn);$('bSfx').textContent=sfxOn?'🔊':'🔇';if(!sfxOn)speechSynthesis.cancel()};

/* ---------- VOZ ---------- */
function say(t){if(!sfxOn||!('speechSynthesis' in window))return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.8;u.pitch=1.15;
 const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)}

/* ---------- CONFETI ---------- */
const cf=$('conf'),cc=cf.getContext('2d');let parts=[],cfRun=false;
function confetti(n=140){cf.width=innerWidth;cf.height=innerHeight;
 for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:6+Math.random()*8,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6,vr:Math.random()*.4-.2});
 if(!cfRun){cfRun=true;requestAnimationFrame(cfLoop)}}
function cfLoop(){cc.clearRect(0,0,cf.width,cf.height);
 parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cc.save();cc.translate(p.x,p.y);cc.rotate(p.r);cc.fillStyle=p.c;cc.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cc.restore()});
 parts=parts.filter(p=>p.y<cf.height+20);
 if(parts.length)requestAnimationFrame(cfLoop);else{cfRun=false;cc.clearRect(0,0,cf.width,cf.height)}}

/* ---------- ESTADO Y FLUJO ---------- */
let li=0,wi=0,hint=1,lock=false,mgLvl=1;
const KEY='abecedario81';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({li,wi,m:mgLvl}))}catch(e){}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.li<27){li=s.li;wi=s.wi;mgLvl=s.m||1;if(li||wi)$('bNew').classList.remove('hide')}}catch(e){}
function show(id){['start','game','mg'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
function modal(html){$('ovc').innerHTML=html;$('ov').classList.remove('hide')}
function closeModal(){$('ov').classList.add('hide')}
function renderMap(){$('map').innerHTML=D.map((d,i)=>`<b class="${i<li?'done':i===li?'cur':''}${MGSET.has(d.l)?' star':''}">${d.l}</b>`).join('')}
function renderWord(){
 const d=D[li],w=d.w[wi],n=li*3+wi;hint=1;lock=false;
 $('let').textContent=d.l;$('emo').innerHTML=w.w==='Iglú'?`<img src="${IGLU}" alt="iglú" style="height:1em;vertical-align:middle">`:w.e;
 $('sub').textContent=`Palabra ${wi+1} de 3 · escribe lo que ves`;
 $('pb').style.width=(n/81*100)+'%';$('pt').textContent=`Palabras: ${n} de 81`;
 renderMap();pattern();$('fb').textContent='';
 const i=$('inp');i.value='';i.className='';i.disabled=false;i.focus();
 setTimeout(()=>say(`Letra ${d.l}. ${w.w}`),300)}
function pattern(){const w=D[li].w[wi].w;
 $('pat').textContent=w.split('').map((c,i)=>i<hint?c.toUpperCase():'_').join(' ')}
function check(){
 if(lock)return;initAudio();
 const w=D[li].w[wi].w,i=$('inp');if(!i.value.trim())return;
 if(norm(i.value)===norm(w)){
  lock=true;i.className='good';i.disabled=true;sfx('ok');
  $('fb').textContent='¡Muy bien! ⭐';$('pat').textContent=w.toUpperCase().split('').join(' ');
  confetti(40);say('¡Muy bien! '+w);
  setTimeout(()=>{wi++;wi===3?letterDone():(save(),renderWord())},1600);
 }else{i.className='';void i.offsetWidth;i.className='bad';sfx('bad');
  $('fb').textContent='Casi… ¡inténtalo otra vez! 💪';say('Inténtalo otra vez')}}
function letterDone(){
 const L=D[li].l;li++;wi=0;save();$('pb').style.width=(li*3/81*100)+'%';
 const mg=MGSET.has(L);sfx('win');confetti(200);
 if(li===27&&!mg)return end();
 say('¡Felicidades! Continuemos con la siguiente letra');
 modal(`<div class="em">🏆</div><h2>¡Felicidades!<br>Continuemos con la siguiente letra</h2>
  <p style="font-size:1.1rem">Completaste la letra <b>${L}</b> 🎉${mg?'<br>¡Ahora, a detener a las gallinas que escapan!':''}</p>
  <button class="btn go" id="bNext">${mg?'🐔 ¡A la granja!':'Siguiente letra ➜'}</button>`);
 $('bNext').onclick=()=>{closeModal();initAudio();mg?startMG():(show('game'),renderWord())}}
function end(){show('game');$('inp').disabled=true;
 modal(`<div class="em">🎓🐤</div><h2>¡Completaste todo el abecedario!</h2>
  <p style="font-size:1.1rem">¡81 palabras escritas! Eres un campeón de las letras.</p>
  <button class="btn go" id="bAgain">Jugar otra vez</button>`);
 say('¡Completaste todo el abecedario! ¡Eres un campeón!');confetti(300);
 $('bAgain').onclick=()=>{li=0;wi=0;save();closeModal();show('game');renderWord()}}

$('bPlay').onclick=()=>{initAudio();setMusic();mMode='main';musicPlay();show('game');renderWord()};
$('bNew').onclick=()=>{li=0;wi=0;save();$('bPlay').click()};
$('bChk').onclick=check;
$('inp').addEventListener('keydown',e=>{initAudio();if(e.key==='Enter')check();else if(e.key.length===1)sfx('key')});
$('bSay').onclick=()=>{initAudio();say(D[li].w[wi].w)};
$('bHint').onclick=()=>{const w=D[li].w[wi].w;if(hint<w.length)hint++;pattern();sfx('key');$('inp').focus()};

 cx.strokeStyle='#fff';cx.lineWidth=4;cx.beginPath();cx.arc(aim.x,aim.y,18,0,7);cx.moveTo(aim.x-28,aim.y);cx.lineTo(aim.x-8,aim.y);cx.moveTo(aim.x+8,aim.y);cx.lineTo(aim.x+28,aim.y);cx.moveTo(aim.x,aim.y-28);cx.lineTo(aim.x,aim.y-8);cx.moveTo(aim.x,aim.y+8);cx.lineTo(aim.x,aim.y+28);cx.stroke();

 txt(`🐔 ${mg.score}/${mg.p.goal}`,14,10,'left');
 txt(`⏱ ${Math.max(0,Math.ceil(mg.left))}`,W-14,10,'right',26,mg.left<=5?'#ffd23f':'#fff');
 txt('❤️'.repeat(Math.max(0,mg.lives))+'🖤'.repeat(5-Math.max(0,mg.lives)),W/2,10,'center',24);
 txt(`Nivel ${mg.n}`,W/2,44,'center',18,'#ffd23f');
 txt(`🏃 ${mg.esc}/6`,14,46,'left',22,mg.esc>=4?'#ff6b6b':'#fff');
 if(mg.ouch>0){cx.globalAlpha=Math.min(1,mg.ouch*2);txt('¡AAAAY! −1 ❤️',W/2,H/2-30,'center',54,'#ff6b6b');cx.globalAlpha=1}
 if(mg.t<2){cx.globalAlpha=Math.min(1,2-mg.t);txt(`¡Detén ${mg.p.goal} gallinas!`,W/2,H/2-40,'center',44,'#ffd23f');cx.globalAlpha=1}}
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
cv.addEventListener('pointermove',e=>{aim=pos(e)});
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(!mg||!mg.on)return;
 aim=pos(e);sfx('shot');mg.fl=.09;
 for(const r of rocks)if(r.st==='fly'&&Math.hypot(aim.x-r.x,aim.y-r.y)<30+r.q*40){r.st='boom';r.bt=0;sfx('hit');return}
 for(let i=birds.length-1;i>=0;i--){const b=birds[i];
  if(b.st==='fall'||Math.hypot(aim.x-b.x,aim.y-b.y)>b.wd*(b.a?.33:.36))continue;
  if(--b.hp>0){b.hurt=.5;sfx('hit');return}
  b.st='fall';b.age=0;b.vy=-170;if(b.a)b.vx=0;else{b.fl=b.vx<0;b.vx*=.3;b.rot=0}mg.score++;sfx('hit');sfx('cluck');
  for(let k=0;k<12;k++)feath.push({x:b.x,y:b.y,vx:(Math.random()-.5)*260,vy:-Math.random()*200,l:.8+Math.random()*.6,c:b.a?'#c97a3a':'#fff'});
  if(mg.score>=mg.p.goal)finish(true);return}});
function mgEnd(win,why){
 const n=mg.n,sc=mg.score,g=mg.p.goal;
 const btn=`<button class="btn go" id="bMg">${win?(li>=27?'Terminar 🎓':'Seguir con las letras ➜'):'🎯 Vuelve a intentarlo'}</button>`;
 const go=()=>{$('bMg').onclick=()=>{closeModal();cancelAnimationFrame(raf);
  if(!win)return startMG();
  mgLvl++;save();mMode='main';li>=27?end():(show('game'),renderWord())}};
 if(win){sfx('win');confetti(220);say('¡Lo lograste!');
  modal(`<div class="em">🎉</div><h2>¡Nivel ${n} superado!</h2><p style="font-size:1.2rem">Detuviste <b>${sc}</b> de ${g} gallinas.${li<27?'<br>El próximo minijuego será más difícil 😈':''}</p>`+btn);return go()}
 modal('<div class="em lose">🤣</div><h2 class="loser">¡PERDEDOR!</h2><p style="font-size:1.6rem;font-weight:700;margin:6px 0">¡JA JA JA JA JA!</p>');
 const next=()=>{const r=why==='lives'?'Te quedaste sin vidas.':why==='escaped'?'Se escaparon 6 gallinas.':'Se acabó el tiempo.';
  $('ovc').innerHTML=`<div class="em">🐔</div><h2>Vuelve a intentarlo</h2><p style="font-size:1.2rem">${r}<br>Detuviste ${sc} de ${g} gallinas.<br>Repetirás el nivel ${n} hasta lograrlo.</p>`+btn;
  go();playBuf('perdiste')||say('Vuelve a intentarlo')};
 if(!playBuf('risa',next)){sfx('laugh');say('Ja, ja, ja, ja, ja. ¡Perdedor!');setTimeout(next,2800)}}
cv.addEventListener('contextmenu',e=>e.preventDefault());
if('speechSynthesis' in window)speechSynthesis.getVoices();
</script>
