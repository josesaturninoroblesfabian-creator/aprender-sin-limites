    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
        }

        /* Custom Wooden Board Look */
        .wood-panel {
            background: #d4a373;
            border: 4px solid #a68a64;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 8px 15px rgba(0,0,0,0.3);
            border-radius: 20px;
        }

        /* Game Card Styles */
        .connect-card {
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .connect-card:hover {
            transform: scale(1.03);
        }

        .connect-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #3b82f6;
            border: 3px solid #ffffff;
            box-shadow: 0 0 8px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .connect-dot.active {
            transform: scale(1.4);
            background-color: #f59e0b;
            box-shadow: 0 0 12px #f59e0b;
        }

        .connect-dot.matched {
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        /* Custom Scrollbar for letter selector */
        .custom-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #f59e0b;
            border-radius: 10px;
        }

        /* Pulsing & animations */
        @keyframes pulse-gentle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-bounce-gentle {
            animation: pulse-gentle 2s infinite ease-in-out;
        }

        /* Prevent SVG selection glitches */
        svg {
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden text-gray-800">

            </div>
        </div>

                <i id="bgmIcon" class="fa-solid fa-music text-lg"></i>
            </button>
            <button id="sfxToggle" onclick="toggleSfx()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold p-2.5 rounded-full border-2 border-blue-900 shadow transition flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12">

    </header>

            </svg>

                </div>

            </button>
        </div>

                [{ id: 208, name: 'Waffle', icon: '🧇' }, { id: 209, name: 'Waterpolo', icon: '🤽' }, { id: 210, name: 'Walkie', icon: '📻' }],
                [{ id: 211, name: 'Web', icon: '🌐' }, { id: 212, name: 'Windsurf', icon: '🏄' }, { id: 213, name: 'Wok', icon: '🥘' }],
                [{ id: 214, name: 'Wi-Fi', icon: '📶' }, { id: 215, name: 'Wombat', icon: '🐻' }, { id: 216, name: 'Western', icon: '🤠' }]
            ],
            'X': [
                [{ id: 217, name: 'Xilófono', icon: '🎼' }, { id: 218, name: 'Xenón', icon: '💡' }, { id: 219, name: 'Xerografía', icon: '🖨️' }],
                [{ id: 220, name: 'Xiphias', icon: '🗡️' }, { id: 221, name: 'Xoloitzcuintle', icon: '🐕' }, { id: 222, name: 'Taxi', icon: '🚕' }],
                [{ id: 223, name: 'Sartén', icon: '🍳' }, { id: 224, name: 'Saxofón', icon: '🎷' }, { id: 225, name: 'Boxeo', icon: '🥊' }]
            ],
            'Y': [
                [{ id: 226, name: 'Yate', icon: '🛥️' }, { id: 227, name: 'Yema', icon: '🍳' }, { id: 228, name: 'Yoyo', icon: '🪀' }],
                [{ id: 229, name: 'Yogur', icon: '🥛' }, { id: 230, name: 'Yegua', icon: '🐎' }, { id: 231, name: 'Yeti', icon: '☃️' }],
                [{ id: 232, name: 'Yunque', icon: '⚒️' }, { id: 233, name: 'Yoga', icon: '🧘' }, { id: 234, name: 'Yacaré', icon: '🐊' }]
            ],
            'Z': [
                [{ id: 235, name: 'Zorro', icon: '🦊' }, { id: 236, name: 'Zapato', icon: '👞' }, { id: 237, name: 'Zanahoria', icon: '🥕' }],
                [{ id: 238, name: 'Zebra', icon: '🦓' }, { id: 239, name: 'Zoológico', icon: '🦁' }, { id: 240, name: 'Zarcillo', icon: '💍' }],
                [{ id: 241, name: 'Zumbido', icon: '🐝' }, { id: 242, name: 'Zueco', icon: '👡' }, { id: 243, name: 'Zigzag', icon: '⚡' }]
            ]
        };

        const alphabetList = Object.keys(alphabetData);

        /* ==========================================================================
           2. GAME STATE MANAGEMENT
           ========================================================================== */
        let currentLetterIndex = 0;
        let currentExerciseIndex = 0; // 0, 1, 2
        let matchesFound = 0;
        let activeStartDot = null;
        let userConnections = []; // Array of completed line objects {startId, endId, color}
        let isDragging = false;
        let dragCurrentPos = { x: 0, y: 0 };
        
        // Progress persistence
        let completedExercises = JSON.parse(localStorage.getItem('abc_completed_exercises') || '{}');

        /* ==========================================================================
           3. WEB AUDIO API - RETRO CHIPTUNE MUSIC & SFX
           ========================================================================== */
        let audioCtx = null;
        let musicMuted = false;
        let sfxMuted = false;
        let bgmOscillator = null;
        let bgmGain = null;
        let isMusicPlaying = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Play Chiptune SFX
        function playSfx(type) {
            if (sfxMuted) return;
            initAudio();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'correct') {
                // Mario coin-like dual tone
                osc.type = 'square';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'wrong') {
                // Low error buzz
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'win') {
                // Retro Fanfare
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.type = 'square';
                    noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    noteGain.gain.setValueAtTime(0.15, now + idx * 0.1);
                    noteGain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.start(now + idx * 0.1);
                    noteOsc.stop(now + idx * 0.1 + 0.2);
                });
            }
        }

        // Synthesize Retro 8-Bit Background Loop
        function startBgm() {
            if (isMusicPlaying || musicMuted) return;
            initAudio();

            isMusicPlaying = true;
            const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 587.33, 440.00, 349.23];
            let noteIndex = 0;

            function playNextNote() {
                if (!isMusicPlaying || musicMuted) return;
                
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(melody[noteIndex], now);
                
                gain.gain.setValueAtTime(0.03, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now);
                osc.stop(now + 0.25);
                
                noteIndex = (noteIndex + 1) % melody.length;
                setTimeout(playNextNote, 250);
            }

            playNextNote();
        }

        function toggleMusic() {
            musicMuted = !musicMuted;
            const icon = document.getElementById('bgmIcon');
            const btn = document.getElementById('bgmToggle');
            
            if (musicMuted) {
                isMusicPlaying = false;
                icon.className = 'fa-solid fa-music-slash text-lg';
                btn.classList.replace('bg-purple-600', 'bg-gray-600');
            } else {
                icon.className = 'fa-solid fa-music text-lg';
                btn.classList.replace('bg-gray-600', 'bg-purple-600');
                startBgm();
            }
            playSfx('click');
        }

        function toggleSfx() {
            sfxMuted = !sfxMuted;
            const icon = document.getElementById('sfxIcon');
            const btn = document.getElementById('sfxToggle');
            
            if (sfxMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-lg';
                btn.classList.replace('bg-blue-600', 'bg-gray-600');
            } else {
                icon.className = 'fa-solid fa-volume-high text-lg';
                btn.classList.replace('bg-gray-600', 'bg-blue-600');
            }
            playSfx('click');
        }

        /* ==========================================================================
           4. GAME UI RENDER & INITIALIZATION
           ========================================================================== */
        window.onload = function() {
            renderAlphabetPicker();
            loadExercise();
            setupGlobalDragListeners();
            window.addEventListener('resize', redrawLines);
        };

        function renderAlphabetPicker() {
            const bar = document.getElementById('alphabetBar');
            bar.innerHTML = '';

            alphabetList.forEach((letter, index) => {
                const btn = document.createElement('button');
                const isCurrent = index === currentLetterIndex;
                
                // Count completed
                let letterDoneCount = 0;
                for (let e = 0; e < 3; e++) {
                    if (completedExercises[`${letter}_${e}`]) letterDoneCount++;
                }

                btn.className = `min-w-[40px] h-10 font-bold text-lg rounded-xl flex items-center justify-center border-2 transition shadow ${
                    isCurrent 
                        ? 'bg-yellow-400 border-yellow-100 text-yellow-950 scale-105 ring-2 ring-yellow-300' 
                        : letterDoneCount === 3
                            ? 'bg-emerald-500 border-emerald-700 text-white'
                            : 'bg-amber-900/60 border-amber-700 text-amber-100 hover:bg-amber-800'
                }`;
                btn.innerText = letter;
                btn.onclick = () => {
                    playSfx('click');
                    currentLetterIndex = index;
                    currentExerciseIndex = 0;
                    renderAlphabetPicker();
                    loadExercise();
                };
                bar.appendChild(btn);
            });
        }

        function loadExercise() {
            const currentLetter = alphabetList[currentLetterIndex];
            const exerciseData = alphabetData[currentLetter][currentExerciseIndex];

            // Reset States
            matchesFound = 0;
            activeStartDot = null;
            userConnections = [];
            
            // Header Info Updates
            document.getElementById('currentLetterDisplay').innerText = currentLetter;
            document.getElementById('letterName').innerText = currentLetter;
            document.getElementById('exerciseNum').innerText = currentExerciseIndex + 1;

            // Render Stars for Exercises
            const starsContainer = document.getElementById('exerciseStars');
            starsContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const star = document.createElement('i');
                const isCompleted = completedExercises[`${currentLetter}_${i}`];
                star.className = `${isCompleted || i <= currentExerciseIndex ? 'fa-solid' : 'fa-regular'} fa-star ${isCompleted ? 'text-yellow-400' : i === currentExerciseIndex ? 'text-yellow-300' : 'text-gray-300'} text-lg`;
                starsContainer.appendChild(star);
            }

            // Total Score Counter
            const totalDone = Object.keys(completedExercises).length;
            document.getElementById('totalProgressText').innerText = `${totalDone} / 81 Completados`;

            // Prepare Left (Images) and Right (Words) Columns - Shuffled
            const imagesList = [...exerciseData].sort(() => Math.random() - 0.5);
            const wordsList = [...exerciseData].sort(() => Math.random() - 0.5);

            renderColumns(imagesList, wordsList);
            redrawLines();
        }

        function renderColumns(imagesList, wordsList) {
            const imgCol = document.getElementById('imagesColumn');
            const wordCol = document.getElementById('wordsColumn');

            imgCol.innerHTML = '';
            wordCol.innerHTML = '';

            // Render Image Cards
            imagesList.forEach(item => {
                const card = document.createElement('div');
                card.className = "connect-card bg-white border-2 border-blue-200 rounded-2xl p-3 shadow-md flex items-center justify-between gap-3 relative";
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-4xl sm:text-5xl select-none filter drop-shadow">${item.icon}</span>
                    </div>
                    <div class="connect-dot" id="dot-img-${item.id}" data-type="img" data-id="${item.id}"></div>
                `;
                imgCol.appendChild(card);
            });

            // Render Word Cards
            wordsList.forEach(item => {
                const card = document.createElement('div');
                card.className = "connect-card bg-white border-2 border-purple-200 rounded-2xl p-3 shadow-md flex items-center justify-between gap-3 relative";
                card.innerHTML = `
                    <div class="connect-dot" id="dot-word-${item.id}" data-type="word" data-id="${item.id}"></div>
                    <div class="flex-grow text-right">
                        <span class="text-lg sm:text-2xl font-bold text-gray-800 tracking-wide">${item.name}</span>
                    </div>
                `;
                wordCol.appendChild(card);
            });

            setupDotEvents();
        }

        /* ==========================================================================
           5. INTERACTIVE LINE DRAWING & MATCHING LOGIC
           ========================================================================== */
        function setupDotEvents() {
            const dots = document.querySelectorAll('.connect-dot');
            dots.forEach(dot => {
                // Mouse & Touch Start
                const startHandler = (e) => {
                    e.preventDefault();
                    initAudio();
                    startBgm();

                    const id = parseInt(dot.getAttribute('data-id'));
                    const type = dot.getAttribute('data-type');

                    // Don't restart if already matched
                    if (isAlreadyMatched(id, type)) return;

                    activeStartDot = { element: dot, id, type };
                    dot.classList.add('active');
                    isDragging = true;
                    playSfx('click');

                    updateDragPos(e);
                };

                dot.addEventListener('mousedown', startHandler);
                dot.addEventListener('touchstart', startHandler, { passive: false });
            });
        }

        function setupGlobalDragListeners() {
            const handleMove = (e) => {
                if (!isDragging || !activeStartDot) return;
                updateDragPos(e);
                redrawLines();
            };

            const handleEnd = (e) => {
                if (!isDragging || !activeStartDot) return;

                // Find element under touch/cursor
                let targetEl = null;
                if (e.changedTouches && e.changedTouches.length > 0) {
                    const touch = e.changedTouches[0];
                    targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
                } else {
                    targetEl = e.target;
                }

                // Check if dropped over a valid dot
                if (targetEl && targetEl.classList.contains('connect-dot')) {
                    const targetId = parseInt(targetEl.getAttribute('data-id'));
                    const targetType = targetEl.getAttribute('data-type');

                    // Check if matching Image to Word
                    if (activeStartDot.type !== targetType && !isAlreadyMatched(targetId, targetType)) {
                        if (activeStartDot.id === targetId) {
                            // CORRECT MATCH!
                            playSfx('correct');
                            activeStartDot.element.classList.remove('active');
                            activeStartDot.element.classList.add('matched');
                            targetEl.classList.add('matched');

                            userConnections.push({
                                startId: activeStartDot.id,
                                endId: targetId,
                                color: '#10b981' // Emerald Green
                            });

                            matchesFound++;
                            if (matchesFound === 3) {
                                handleExerciseVictory();
                            }
                        } else {
                            // WRONG MATCH
                            playSfx('wrong');
                            activeStartDot.element.classList.remove('active');
                        }
                    } else {
                        activeStartDot.element.classList.remove('active');
                    }
                } else {
                    activeStartDot.element.classList.remove('active');
                }

                isDragging = false;
                activeStartDot = null;
                redrawLines();
            };

            window.addEventListener('mousemove', handleMove);
            window.addEventListener('touchmove', handleMove, { passive: false });
            window.addEventListener('mouseup', handleEnd);
            window.addEventListener('touchend', handleEnd);
        }

        function updateDragPos(e) {
            if (e.touches && e.touches.length > 0) {
                dragCurrentPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else {
                dragCurrentPos = { x: e.clientX, y: e.clientY };
            }
        }

        function isAlreadyMatched(id, type) {
            return userConnections.some(conn => conn.startId === id);
        }

        /* Redraw SVG connecting lines */
        function redrawLines() {
            const svg = document.getElementById('svgCanvas');
            const svgRect = svg.getBoundingClientRect();
            svg.innerHTML = '';

            // Draw Completed Connections
            userConnections.forEach(conn => {
                const imgDot = document.getElementById(`dot-img-${conn.startId}`);
                const wordDot = document.getElementById(`dot-word-${conn.endId}`);

                if (imgDot && wordDot) {
                    const p1 = getCenterCoords(imgDot, svgRect);
                    const p2 = getCenterCoords(wordDot, svgRect);

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', p1.x);
                    line.setAttribute('y1', p1.y);
                    line.setAttribute('x2', p2.x);
                    line.setAttribute('y2', p2.y);
                    line.setAttribute('stroke', conn.color);
                    line.setAttribute('stroke-width', '6');
                    line.setAttribute('stroke-linecap', 'round');
                    svg.appendChild(line);
                }
            });

            // Draw Active Dragging Line
            if (isDragging && activeStartDot) {
                const startDot = activeStartDot.element;
                const p1 = getCenterCoords(startDot, svgRect);
                const p2 = {
                    x: dragCurrentPos.x - svgRect.left,
                    y: dragCurrentPos.y - svgRect.top
                };

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', p1.x);
                line.setAttribute('y1', p1.y);
                line.setAttribute('x2', p2.x);
                line.setAttribute('y2', p2.y);
                line.setAttribute('stroke', '#f59e0b');
                line.setAttribute('stroke-width', '5');
                line.setAttribute('stroke-dasharray', '8,8');
                line.setAttribute('stroke-linecap', 'round');
                svg.appendChild(line);
            }
        }

        function getCenterCoords(element, svgRect) {
            const rect = element.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2 - svgRect.left,
                y: rect.top + rect.height / 2 - svgRect.top
            };
        }

        /* ==========================================================================
           6. VICTORY AND NAVIGATION LOGIC
           ========================================================================== */
        function handleExerciseVictory() {
            const currentLetter = alphabetList[currentLetterIndex];
            completedExercises[`${currentLetter}_${currentExerciseIndex}`] = true;
            localStorage.setItem('abc_completed_exercises', JSON.stringify(completedExercises));

            playSfx('win');
            triggerConfetti();

            setTimeout(() => {
                const modal = document.getElementById('winModal');
                const title = document.getElementById('modalTitle');
                const msg = document.getElementById('modalMessage');

                if (currentExerciseIndex < 2) {
                    title.innerText = "¡Muy Bien!";
                    msg.innerText = `Has completado el ejercicio ${currentExerciseIndex + 1} de la Letra ${currentLetter}.`;
                } else {
                    title.innerText = "¡Fantástico!";
                    msg.innerText = `¡Felicidades! Has completado todos los ejercicios de la Letra ${currentLetter}.`;
                }

                modal.classList.remove('hidden');
                renderAlphabetPicker();
            }, 500);
        }

        function closeModalAndContinue() {
            document.getElementById('winModal').classList.add('hidden');
            if (currentExerciseIndex < 2) {
                currentExerciseIndex++;
            } else {
                currentExerciseIndex = 0;
                currentLetterIndex = (currentLetterIndex + 1) % alphabetList.length;
            }
            renderAlphabetPicker();
            loadExercise();
        }

        function resetCurrentExercise() {
            playSfx('click');
            loadExercise();
        }

        function nextExerciseManual() {
            playSfx('click');
            if (currentExerciseIndex < 2) {
                currentExerciseIndex++;
            } else {
                currentExerciseIndex = 0;
                currentLetterIndex = (currentLetterIndex + 1) % alphabetList.length;
            }
            renderAlphabetPicker();
            loadExercise();
        }

        function prevLetter() {
            playSfx('click');
            if (currentExerciseIndex > 0) {
                currentExerciseIndex--;
            } else {
                currentLetterIndex = (currentLetterIndex - 1 + alphabetList.length) % alphabetList.length;
                currentExerciseIndex = 2;
            }
            renderAlphabetPicker();
            loadExercise();
        }

        function triggerConfetti() {
            if (window.confetti) {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
