 <g><rect x="1000" y="585" width="240" height="190" rx="30" fill="#647b9b" stroke="#fff" stroke-width="5"/><text x="1120" y="655" font-size="54">⚙️</text><text x="1120" y="714" font-size="27" font-weight="bold" fill="#fff">Ajustes</text><text x="1120" y="748" font-size="17" fill="#fff">Sonido y accesibilidad</text></g>
