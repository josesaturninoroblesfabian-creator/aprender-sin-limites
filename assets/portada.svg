<path d="M410 870Q768 790 1126 870L1095 956Q768 1000 441 956Z" fill="#07478b" stroke="#fff" stroke-width="5"/><text x="768" y="904" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#fff">¡Tu conocimiento no tiene fronteras!</text><text x="768" y="937" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#ffe044">Una aventura para aprender, incluso sin conexión</text>
