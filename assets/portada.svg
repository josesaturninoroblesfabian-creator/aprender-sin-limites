<g filter="url(#shadow)"><path d="M346 82Q768 30 1190 82L1160 251Q768 292 376 251Z" fill="#07478b" stroke="#fff" stroke-width="8"/><text x="768" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="76" font-weight="900" fill="#ffc928" stroke="#9b4b00" stroke-width="3" paint-order="stroke">APRENDE</text><text x="768" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="54" font-weight="900" fill="#fff">SIN LÍMITES</text><text x="768" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#fff">JUEGA  •  APRENDE  •  DESCUBRE</text></g>
<text x="115" y="170" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#fff" transform="rotate(-5 115 170)">Grandes sueños</text><text x="115" y="207" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#fff" transform="rotate(-5 115 207)">también en los Andes</text>
<text x="1240" y="165" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#fff">Aprender juntos,</text><text x="1240" y="201" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#fff">crecer sin fronteras</text>
