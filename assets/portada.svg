 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#48b6f5"/><stop offset=".56" stop-color="#d6f0ff"/><stop offset="1" stop-color="#f8d59a"/></linearGradient>
 <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#81c65d"/><stop offset="1" stop-color="#277c54"/></linearGradient>
 <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#fffdf2"/><stop offset="1" stop-color="#ffebc6"/></linearGradient>
